[project]
name = "volunteer-management-backend"
version = "1.0.0"
description = "Panah Platform API — smart rescue and relief"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15,<4",
    "djangorestframework-simplejwt>=5.4,<6",
    "drf-spectacular>=0.28,<1",
    "django-filter>=24.3,<25",
    "django-cors-headers>=4.6,<5",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<6",
    "celery>=5.4,<6",
    "django-celery-beat>=2.7,<3",
    "gunicorn>=23.0,<24",
    "python-dotenv>=1.0,<2",
    "argon2-cffi>=23.1,<24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "ruff>=0.8,<1",
    "factory-boy>=3.3,<4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
