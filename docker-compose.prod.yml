# Production overrides — use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  volunteer-management-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "0"
      BACKUP_ROOT: /backups
      LOG_DIR: /var/log/app
    volumes:
      - ./media:/app/media
      - ./static:/app/staticfiles
      - ./logs:/var/log/app
      - ./database/backups:/backups

  volunteer-management-celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "0"
      BACKUP_ROOT: /backups
      LOG_DIR: /var/log/app
    volumes:
      - ./media:/app/media
      - ./logs:/var/log/app
      - ./database/backups:/backups

  volunteer-management-celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "0"
      BACKUP_ROOT: /backups
      LOG_DIR: /var/log/app
    volumes:
      - ./media:/app/media
      - ./logs:/var/log/app
      - ./database/backups:/backups

  volunteer-management-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes: []

  volunteer-management-mailhog:
    profiles:
      - dev-only

  volunteer-management-pgadmin:
    profiles:
      - dev-only

  volunteer-management-nginx:
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/conf.d/ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      - ./infrastructure/nginx/snippets:/etc/nginx/snippets:ro
      - ./static:/var/www/static:ro
      - ./media:/var/www/media:ro
      - ./logs/nginx:/var/log/nginx
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
