upstream volunteer_management_backend {
    server volunteer-management-backend:8000;
    keepalive 32;
}

# Development: Vite dev server on port 5173
# Production: change to volunteer-management-frontend:80
upstream volunteer_management_frontend {
    server volunteer-management-frontend:5173;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/security-headers.conf;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /api/ {
        proxy_pass http://volunteer_management_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://volunteer_management_frontend;
        proxy_http_version 1.1;
        # Vite dev server rejects unknown Host headers (403); always send localhost
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
